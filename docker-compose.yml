services:
  luceed-mcp:
    # Prefer published image; fall back to local build.
    image: ${LUCEED_MCP_IMAGE:-ghcr.io/splacento-incomm/luceed-mcp:latest}
    build: .
    # Bind loopback only — put Apache/nginx TLS in front for the public URL.
    ports:
      - "127.0.0.1:${MCP_HTTP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8080"
    volumes:
      # Optional SSH key for Luceed IP whitelist tunnel (see SSH_* in .env)
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
